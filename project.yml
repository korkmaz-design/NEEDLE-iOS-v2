name: NEEDLE
options:
  bundleIdPrefix: com.korkmazdesign
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NEEDLE:
    type: application
    platform: iOS
    sources:
      - path: NEEDLE
      - path: Shared/NEEDLEAttributes.swift
    dependencies:
      - target: NEEDLEWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.korkmazdesign.needle
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "NEEDLE, Apple Music kitaplığınızı aramak ve müzik çalmak için erişim ister."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  NEEDLEWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NEEDLEWidget
      - path: Shared/NEEDLEAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.korkmazdesign.needle.widget
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
